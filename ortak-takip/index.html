 const n=new Date(), y=n.getFullYear(),m=n.getMonth();
 if(period==="all")return {start:null,end:null,label:"Tüm dönemler"};
 if(period==="2026-11")return {start:"2026-11-01",end:"2026-11-30",label:"Kasım 2026"};

 if(period==="week"){const d=(n.getDay()+6)%7,mon=new Date(y,m,n.getDate()-d);return {start:iso(mon),end:iso(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6)),label:"Bu hafta"};}

let authMode="login";
let recoveryMode=new URLSearchParams(window.location.hash.replace(/^#/,"")).get("type")==="recovery";

  recoveryMode=true;
  $("#auth").classList.remove("hide");$("#shell").classList.add("hide");
  $("#authform").classList.add("hide");$("#recoveryForm").classList.remove("hide");

}

  recoveryMode=false;
  $("#authform").classList.remove("hide");$("#recoveryForm").classList.add("hide");
  $(".authlinks").classList.remove("hide");$(".authbox h1").textContent="Ortak Takip";

$("#recoveryForm").onsubmit=async ev=>{
  ev.preventDefault();
  const pass=$("#newRecoveryPassword").value,repeat=$("#confirmRecoveryPassword").value;
  const btn=$("#recoveryForm button[type=submit]");
  if(pass.length<8){$("#authmsg").textContent="Yeni şifre en az 8 karakter olmalıdır.";return}
  if(pass!==repeat){$("#authmsg").textContent="Şifreler uyuşmuyor.";return}
  btn.disabled=true;
  try {
    const verified=await sb.auth.getUser();
    if(verified.error||!verified.data?.user)throw Error("Şifre yenileme bağlantısı geçersiz veya süresi dolmuş. Yeni bağlantı isteyin.");
    const result=await sb.auth.updateUser({password:pass});
    if(result.error)throw result.error;
    exitRecoveryScreen();
    window.history.replaceState(null,"",window.location.pathname);
    await sb.auth.signOut();
    $("#password").value="";
    $("#authmsg").textContent="Şifreniz güncellendi. Yeni şifrenizle giriş yapabilirsiniz.";
  }catch(e){$("#authmsg").textContent=e?.message||"Şifre güncellenemedi."}
  finally{btn.disabled=false}
};

function makeReportSnapshot(){
  const items=reportTasks().slice(),day=iso(new Date()),period=state.reportPeriod==="month"?"Bu ay açılan işler":state.reportPeriod==="30"?"Son 30 günde açılan işler":"Tüm tarihler";
  const scope=state.reportStream==="all"?"Tüm iş grupları":streamName(state.reportStream);
  const open=items.filter(t=>!["tamamlandi","iptal"].includes(t.status));
  const done=items.filter(t=>t.status==="tamamlandi").length;
  const groups=state.streams.filter(w=>state.reportStream==="all"||w.id===state.reportStream).map(w=>{
    const groupItems=items.filter(t=>t.workstream_id===w.id);
    const completed=groupItems.filter(t=>t.status==="tamamlandi").length;
    const late=groupItems.filter(t=>t.due_date&&t.due_date<day&&!["tamamlandi","iptal"].includes(t.status)).length;
    return {name:w.name,lead:memberName(w.lead_user_id),total:groupItems.length,done:completed,late,pct:groupItems.length?Math.round(100*completed/groupItems.length):0};
  });
  const tasks=items.map((t,i)=>({num:i+1,group:streamName(t.workstream_id),title:t.title,description:t.description||"",person:memberName(t.assigned_to),
    collaborators:(t.collaborator_user_ids||[]).map(memberName).join(", "),status:labels[t.status]||t.status,priority:labels[t.priority]||t.priority,
    due:t.due_date||"",progress:Number(t.progress)||0,transfer:t.last_delegated_at||"",transferredBy:t.last_delegated_by?memberName(t.last_delegated_by):""}));
  return {day,period,scope,tasks,groups,totals:{total:items.length,done,open:open.length,late:open.filter(t=>t.due_date&&t.due_date<day).length,
    shared:items.filter(t=>(t.collaborator_user_ids||[]).length>0).length,delegated:items.filter(t=>t.last_delegated_at).length,
    percent:items.length?Math.round(100*done/items.length):0}};
}

const reportLibraries={};
function loadReportLibrary(url,ready){
  if(ready())return Promise.resolve();
  if(!reportLibraries[url]){
    reportLibraries[url]=new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      script.src=url;script.async=true;script.crossOrigin="anonymous";
      script.onload=()=>ready()?resolve():reject(Error("Dışa aktarma kitaplığı başlatılamadı"));
      script.onerror=()=>reject(Error("Dışa aktarma kitaplığı indirilemedi. İnternet bağlantısını kontrol edin"));
      document.head.appendChild(script);
    }).catch(err=>{delete reportLibraries[url];throw err});
  }
  return reportLibraries[url];
}

function taskOccursOnDay(t,day){
  if(t.status==="iptal")return false;
  const start=t.start_date||t.due_date,end=t.due_date||t.start_date;
  if(!start)return false;
  if(end<start)return day===start||day===end;
  return start<=day&&day<=end;
}

async function changeGoalApproval(id,status,btn){
 const g=state.goals.find(x=>x.id===id);if(!g||!canManage())return;
 const current=g.approval_status||"approved";
 const allowed=(current==="draft"&&status==="pending"&&g.target_value!==null&&Number(g.target_value)>0)||
 (current==="pending"&&state.role==="owner"&&["approved","draft"].includes(status))||
 (current==="approved"&&state.role==="owner"&&status==="draft");
 if(!allowed){toast("Bu durum değişikliği için yetkiniz yok veya hedef rakamı eksik.");return}
 const msg=status==="pending"?"Hedef Admin onayına gönderilsin mi?":status==="approved"?"Hedefi onaylıyor musunuz?":"Hedef yeniden taslağa alınsın mı?";
 if(!window.confirm(msg))return;btn.disabled=true;
 try{
  await requireActiveSession();
  const {data,error:e}=await sb.from("goals").update({approval_status:status,updated_at:new Date().toISOString()})
   .eq("id",id).eq("workspace_id",WS).eq("approval_status",current).select("id").single();
  if(e||!data)throw Error(e?.message||"Hedef durumu güncellenemedi");
  toast(status==="approved"?"Hedef onaylandı.":status==="pending"?"Admin onayına gönderildi.":"Taslağa alındı.");
  await refresh();
 }catch(e){error(e)}finally{btn.disabled=false}
}

async function requireActiveSession(){
  const verified=await sb.auth.getUser();
  if(verified.error || !verified.data?.user || verified.data.user.id!==state.user?.id){
    closeModal();showAuth();
    $("#authmsg").textContent="Oturumunuz geçersiz veya süresi dolmuş. Lütfen yeniden giriş yapıp işlemi tekrar deneyin.";
    throw Error("Oturum doğrulanamadı; yeniden giriş yapmanız gerekiyor.");
  }
  const result=await sb.auth.getSession();
  if(result.error || !result.data?.session?.access_token){
    closeModal();showAuth();
    $("#authmsg").textContent="Oturumunuz süresi dolduğu için kapandı. Lütfen yeniden giriş yapın.";
    throw Error("Oturum süresi doldu. Lütfen yeniden giriş yapın.");
  }
  return result.data.session;
}
$("#modalForm").onsubmit=async ev=>{ev.preventDefault();const b=$("#modalForm button[type=submit]");b.disabled=true;const fd=new FormData(ev.target);const data=Object.fromEntries(fd);const shared=[...new Set(fd.getAll("shared_users"))].filter(id=>state.members.some(m=>m.user_id===id&&m.is_active));delete data.shared_users;try{
const session=await requireActiveSession();
if(modalKind==="memberEdit"||modalKind==="memberPassword"){
 if(state.role!=="owner"||!editing?.user_id)throw Error("Bu işlem yalnızca Admin tarafından yapılabilir.");
 const body=modalKind==="memberEdit"?
  {action:"update_member",user_id:editing.user_id,full_name:data.full_name,position_title:data.position_title,email:data.email,role:data.role}:
  {action:"set_password",user_id:editing.user_id,password:data.password};
 if(modalKind==="memberPassword"){
  if(data.password!==data.confirm_password)throw Error("Şifreler eşleşmiyor.");
  if(!window.confirm(memberName(editing.user_id)+" kullanıcısının şifresini değiştirmek istiyor musunuz?"))return;
 }
 const res=await fetch("https://gnwliizxuryfnpqrynym.supabase.co/functions/v1/ortak-takip-admin",{
  method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)
 });
 const answer=await res.json();
 if(!res.ok)throw Error(answer.error||"İşlem başarısız");
 closeModal();toast(answer.message||"Bilgiler güncellendi.");await refresh();
 return;
}
if(modalKind==="goalActual"){
 if(!editing||editing.approval_status!=="approved")throw Error("Onaylı hedef bulunamadı.");
 const v=data.actual_value===""?null:Number(data.actual_value);
 if(v!==null&&(!Number.isFinite(v)||v<0))throw Error("Gerçekleşen değer geçersiz.");
 const {data:updated,error:e}=await sb.from("goals").update({actual_value:v,updated_at:new Date().toISOString()})
  .eq("id",editing.id).eq("workspace_id",WS).eq("approval_status","approved").select("id").single();
 if(e||!updated)throw Error(e?.message||"Güncelleme başarısız.");
 closeModal();toast("Gerçekleşen değer kaydedildi.");await refresh();return;
}
if(modalKind==="member"){const r=await fetch("https://gnwliizxuryfnpqrynym.supabase.co/functions/v1/ortak-takip-panel?api=invite",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify({workspace_id:WS,email:data.email.trim(),full_name:data.full_name.trim(),role:data.role})});const d=await r.json();if(!r.ok)throw Error(d.error||"Davet gönderilemedi");toast("Davet gönderildi")}
else if(modalKind==="stream"){if(!canManage()||!editing)throw Error("Bu işlem için yönetici yetkisi gereklidir.");const payload={name:data.name.trim(),description:data.description||"",lead_user_id:data.lead_user_id||null,collaborator_user_ids:shared.filter(x=>x!==data.lead_user_id)};const r=await sb.from("workstreams").update(payload).eq("id",editing.id).eq("workspace_id",WS);if(r.error)throw r.error;toast("Bölüm bilgileri güncellendi")}
else{const table=modalKind==="task"?"tasks":modalKind==="goal"?"goals":"calendar_events";const payload={...data,workspace_id:WS};for(const k of ["workstream_id","assigned_to","owner_id","start_date","due_date","period_start","period_end"])if(k in payload&&!payload[k])payload[k]=null;
if(modalKind==="task"){payload.collaborator_user_ids=canManage()?shared:(editing?.collaborator_user_ids||[]);if(editing&&editing.assigned_to!==payload.assigned_to&&canManage()){payload.last_delegated_at=new Date().toISOString();payload.last_delegated_by=state.user.id}payload.progress=Number(payload.progress);if(payload.status==="tamamlandi"){payload.progress=100;payload.completed_at=new Date().toISOString()}else if(editing?.status==="tamamlandi")payload.completed_at=null}
if(modalKind==="goal"){
 if(editing?.approval_status&&editing.approval_status!=="draft")throw Error("Yalnızca taslak hedef düzenlenebilir.");
 payload.target_value=payload.target_value===""?null:Number(payload.target_value);
 payload.actual_value=payload.actual_value===""?null:Number(payload.actual_value);
 if((payload.target_value!==null&&(!Number.isFinite(payload.target_value)||payload.target_value<0))||
    (payload.actual_value!==null&&(!Number.isFinite(payload.actual_value)||payload.actual_value<0)))
  throw Error("Hedef ve gerçekleşen değerler sıfırdan küçük olamaz.");
 if(!payload.period_start||!payload.period_end||payload.period_end<payload.period_start)
  throw Error("Geçerli bir başlangıç ve bitiş dönemi seçin.");
 if(payload.goal_level==="bolum"&&!payload.workstream_id)throw Error("Bölüm hedefi için iş grubu seçin.");
 if(payload.goal_level==="bireysel"&&!payload.owner_id)throw Error("Bireysel hedef için sorumlu seçin.");
 if(payload.goal_level==="kurumsal"){payload.workstream_id=null;payload.owner_id=null;}
 payload.title=String(payload.title||"").trim();payload.unit=String(payload.unit||"").trim();
 if(payload.title.length<3||!payload.unit)throw Error("Hedef adı ve birim zorunludur.");
}
if(modalKind==="event"){if(new Date(payload.ends_at)<=new Date(payload.starts_at))throw Error("Bitiş başlangıçtan sonra olmalı");payload.starts_at=new Date(payload.starts_at).toISOString();payload.ends_at=new Date(payload.ends_at).toISOString()}
let r;if(editing){r=await sb.from(table).update(payload).eq("id",editing.id).eq("workspace_id",WS)}else{payload.created_by=state.user.id;r=await sb.from(table).insert(payload)}
if(r.error)throw r.error;toast("Kayıt başarıyla kaydedildi")}
closeModal();await refresh()
}catch(e){error(e)}finally{b.disabled=false}};

  if(event==="PASSWORD_RECOVERY"){showRecoveryScreen();return}

  if(recoveryMode)return;
  if(event==="SIGNED_IN"||event==="TOKEN_REFRESHED")setTimeout(()=>{if($("#shell").classList.contains("hide"))boot()},0);
});
