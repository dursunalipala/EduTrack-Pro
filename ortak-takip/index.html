<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#1b2e45;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.hide{display:none!important}

ound:#fff;border:1px solid #dbe4ee;border-radius:9px;min-width:0;color:#26374d}textarea{resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #9bdfe1;outline-offset:1px}.filters input{width:250px}.filters select{max-width:225px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:12px;color:#8491a4;text-transform:uppercase;letter-spacing:.35px;border-bottom:1px solid #e9edf4;padding:12px}td{border-bottom:1px solid #eff2f6;padding:14px 12px;font-size:13px}tr:last-child td{border:0}td .taskname{font-weight:700;color:#1a314b;white-space:normal;min-width:210px}.tag{font-size:11px;font-weight:750;padding:5px 9px;border-radius:8px;background:#edf3f7;color:#597085;display:inline-block}.tag.kritik{background:#ffebe9;color:#be473e}.tag.yuksek{background:#fff1da;color:#b27724}.tag.tamamlandi{background:#dcf6e9;color:#17825f}.tag.devam_ediyor{background:#e4f0fe;color:#2e72aa}.tag.beklemede{background:#fff1da;color:#a97b32}.empty{padding:40px 12px;text-align:center;color:#7e8ea2}.sectionlabel{font-weight:750;color:#24415f;font-size:12px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:9px}.gridcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.goal{border:1px solid #e7edf5;border-radius:12px;padding:18px;background:#fff}.goal h3{font-size:16px;margin:0 0 8px}.goal .val{font-size:23px;font-weight:850}.calendarhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.caldow{font-size:12px;text-align:center;padding:9px 0;font-weight:800;color:#7b8ca2}.day{min-height:116px;border:1px solid #edf1f5;border-radius:9px;padding:9px;background:white;min-width:0}.day.off{background:#fafbfd;color:#b6c0ca}.day.today{border-color:#15999c;box-shadow:inset 0 0 0 1px #15999c}.daynum{font-size:12px;font-weight:800;margin-bottom:7px}.calitem{font-size:10px;line-height:1.3;background:#e9f4f7;color:#17647c;border-radius:5px;padding:4px;margin:3px 0;word-wrap:break-word}.calitem.ev{background:#edeafa;color:#67509c}.member{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid #e9eef4}.member:last-child{border:0}.miniavatar{height:38px;width:38px;border-radius:50%;background:#e1eef8;display:grid;place-items:center;font-weight:800;color:#235579}.modalscrim{position:fixed;inset:0;background:#10213ba8;display:grid;place-items:center;z-index:20;padding:18px}.modal{background:white;border-radius:18px;padding:24px;width:100%;max-width:660px;max-height:90vh;overflow-y:auto;box-shadow:0 18px 80px #142c4952}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.modalhead h2{margin:0;font-size:22px}.x{border:0;background:#edf1f4;border-radius:50%;height:32px;width:32px;font-weight:bold}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.fields label{font-size:12px;font-weight:750;color:#56687d;display:flex;flex-direction:column;gap:6px}.fields .span2{grid-column:1/-1}.modalbuttons{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}#toast{position:fixed;bottom:22px;right:22px;background:#162c46;color:#fff;border-radius:12px;padding:14px 19px;z-index:30;max-width:400px;box-shadow:0 8px 28px #1b2e4529;display:none;font-size:14px}
#auth{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top right,#1e6573,#122947 55%,#0d1d35)}.authbox{background:white;border-radius:20px;width:min(420px,calc(100% - 30px));padding:36px;box-shadow:0 20px 70px #0003}.authbox h1{font-size:28px;letter-spacing:-1px;margin:18px 0 4px}.authbox p{color:#748499;font-size:14px;margin:0 0 25px}.authbox input{width:100%;margin-bottom:12px}.authbox .btn{width:100%;margin-top:4px}.authlinks{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.linkbtn{border:0;background:transparent;color:#166f8a;font-size:13px;font-weight:700;padding:5px}.authbox .logo{width:52px;height:52px;border-radius:14px}.tiny{font-size:11px;color:#8695a5}
@media(max-width:1100px){.kpi{grid-template-columns:repeat(3,1fr)}.twocol{grid-template-columns:1fr}}@media(max-width:780px){aside{position:static;width:100%;padding:11px 14px;display:block}.brand{margin:0 0 9px;font-size:18px}.nav{flex-direction:row;overflow:auto;gap:4px}.nav button{white-space:nowrap;font-size:12px;padding:9px 11px}.sidefoot{display:none}main{margin-left:0}.top{padding:19px 17px}.top h1{font-size:19px}.topright .muted{display:none}.content{padding:16px}.kpi{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:13px}.card .num{font-size:25px}.panel{padding:15px}.gridcards{grid-template-columns:1fr}.calgrid{gap:2px}.day{padding:3px;min-height:75px;border-radius:4px}.daynum{font-size:10px}.calitem{font-size:8px;padding:2px}.filters input,.filters select{width:100%;max-width:none}.fields{grid-template-columns:1fr}}
</style></head>
<body>
<section id="auth"><div class="authbox"><div class="logo">✓</div><h1>Ortak Takip</h1><p>Kurumsal yönetim ve görev takip sistemi</p><form id="authform"><div id="namefield" class="hide"><input id="authname" placeholder="Adınız soyadınız" autocomplete="name"></div><input id="email" type="email" placeholder="E-posta adresiniz" required autocomplete="username"><input id="password" type="password" placeholder="Şifre (en az 8 karakter)" required minlength="8" autocomplete="current-password"><button id="submitAuth" class="btn primary" type="submit">Giriş Yap</button></form><div class="authlinks"><button class="linkbtn" id="switchAuth">Hesap oluştur</button><button class="linkbtn" id="resetAuth">Şifremi unuttum</button></div><p id="authmsg" class="small" style="margin:18px 0 0"></p><p class="tiny" style="margin-top:16px">Yalnızca yetkili kullanıcıların kurum verilerine erişmesine izin verilir.</p></div></section>
<div id="shell" class="hide"><aside><div class="brand"><span class="logo">✓</span> Ortak Takip</div><nav class="nav" id="nav"><button data-view="overview" class="active"><span class="ic">◫</span> Genel Bakış</button><button data-view="tasks"><span class="ic">☑</span> Görev Takibi</button><button data-view="calendar"><span class="ic">▦</span> Takvim</button><button data-view="goals"><span class="ic">◎</span> Hedefler</button><button data-view="streams"><span class="ic">▤</span> İş Grupları</button><button data-view="members"><span class="ic">♧</span> Ortaklar ve Ekip</button></nav><div class="sidefoot"><div id="sideemail"></div><button id="logout">Oturumu Kapat</button></div></aside><main><header class="top"><div><h1 id="pageTitle">Genel Bakış</h1><p id="pageSubtitle">Kurumların tüm iş ve sorumlulukları tek ekranda</p></div><div class="topright"><span id="userrole" class="muted small"></span><div id="avatar" class="avatar">OT</div></div></header><div class="content" id="content"></div></main></div>
<div id="modalscrim" class="modalscrim hide"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Yeni kayıt</h2><button class="x" id="closeModal" aria-label="Kapat">×</button></div><form id="modalForm"><div id="modalFields" class="fields"></div><div class="modalbuttons"><button type="button" class="btn" id="cancelModal">Vazgeç</button><button class="btn primary" type="submit">Kaydet</button></div></form></div></div><div id="toast"></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.95.0";
const URL="https://gnwliizxuryfnpqrynym.supabase.co",KEY="sb_publishable_nNQjagytmTUtlvUL6MYOmw_UQJANk3C";
const sb=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const WS="bd7ea9a8-f1b7-4c32-9c8c-44725374ac6b";
const $=s=>document.querySelector(s),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state={user:null,role:"",view:"overview",tasks:[],streams:[],goals:[],events:[],members:[],profiles:[],month:new Date(),search:"",status:"all",stream:"all"};
const labels={taslak:"Taslak",beklemede:"Beklemede",devam_ediyor:"Devam Ediyor",tamamlandi:"Tamamlandı",iptal:"İptal",dusuk:"Düşük",normal:"Normal",yuksek:"Yüksek",kritik:"Kritik",owner:"Kurucu",manager:"Yönetici",member:"Üye",viewer:"İzleyici"};
const options=(items,v)=>items.map(x=>'<option value="'+esc(x[0])+'"'+(String(v??"")===String(x[0])?' selected':'')+'>'+esc(x[1])+'</option>').join("");
const date=s=>s?new Date(s.length===10?s+"T12:00:00":s).toLocaleDateString("tr-TR"):"—";
const iso=d=>{const a=new Date(d);return a.getFullYear()+"-"+String(a.getMonth()+1).padStart(2,"0")+"-"+String(a.getDate()).padStart(2,"0")};
const canManage=()=>["owner","manager"].includes(state.role);
function toast(m){const a=$("#toast");a.textContent=m;a.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>a.style.display="none",4500)}
function error(e){toast(e?.message||String(e)||"İşlem başarısız");console.error(e)}
let authMode="login";
$("#switchAuth").onclick=()=>{authMode=authMode==="login"?"signup":"login";$("#namefield").classList.toggle("hide",authMode!=="signup");$("#submitAuth").textContent=authMode==="signup"?"Hesap Oluştur":"Giriş Yap";$("#switchAuth").textContent=authMode==="signup"?"Girişe dön":"Hesap oluştur";$("#authmsg").textContent=""};
$("#resetAuth").onclick=async()=>{const email=$("#email").value.trim();if(!email){$("#authmsg").textContent="Önce e-posta adresinizi giriniz.";return}const {error:e}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});$("#authmsg").textContent=e?e.message:"Şifre sıfırlama bağlantısı e-posta adresinize gönderildi."};
$("#authform").onsubmit=async ev=>{ev.preventDefault();const b=$("#submitAuth");b.disabled=true;$("#authmsg").textContent="";const email=$("#email").value.trim(),password=$("#password").value;try{let r;if(authMode==="signup"){r=await sb.auth.signUp({email,password,options:{data:{full_name:$("#authname").value.trim()},emailRedirectTo:window.location.origin+window.location.pathname}});if(r.error)throw r.error;$("#authmsg").textContent="Hesabınız oluşturuldu. E-posta doğrulama bağlantısını açıp ardından giriş yapınız."}else{r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;await boot()}}catch(e){$("#authmsg").textContent=e.message}finally{b.disabled=false}};
$("#logout").onclick=async()=>{await sb.auth.signOut();showAuth()};
function showAuth(){$("#auth").classList.remove("hide");$("#shell").classList.add("hide")}
async function fetchAll(){const q=[sb.from("workstreams").select("*").eq("workspace_id",WS).order("sort_order"),sb.from("tasks").select("*").eq("workspace_id",WS).order("created_at",{ascending:false}),sb.from("goals").select("*").eq("workspace_id",WS),sb.from("calendar_events").select("*").eq("workspace_id",WS),sb.from("workspace_members").select("*").eq("workspace_id",WS)];
const r=await Promise.all(q);for(const a of r)if(a.error)throw a.error;
[state.streams,state.tasks,state.goals,state.events,state.members]=r.map(a=>a.data||[]);
let ids=state.members.map(x=>x.user_id);
state.profiles=[];if(ids.length){const p=await sb.from("profiles").select("id,full_name").in("id",ids);if(!p.error)state.profiles=p.data||[]}
}
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){showAuth();return}state.user=user;
const {data:me,error:e}=await sb.from("workspace_members").select("role,is_active").eq("workspace_id",WS).eq("user_id",user.id).maybeSingle();if(e){error(e);return}
if(!me?.is_active){showAuth();$("#authmsg").textContent="Giriş yapıldı ancak Ortak Takip çalışma alanı yetkiniz henüz tanımlanmamış. Yöneticiye başvurunuz.";return}
state.role=me.role;$("#sideemail").textContent=user.email||"";$("#userrole").textContent=labels[state.role]||state.role;$("#avatar").textContent=(user.user_metadata?.full_name||user.email||"OT").slice(0,2).toLocaleUpperCase("tr-TR");await refresh();$("#auth").classList.add("hide");$("#shell").classList.remove("hide")}
async function refresh(){try{await fetchAll();render()}catch(e){error(e)}}
const streamName=id=>state.streams.find(s=>s.id===id)?.name||"Genel",memberName=id=>state.profiles.find(p=>p.id===id)?.full_name||state.members.find(m=>m.user_id===id)?.user_id.slice(0,8)||"Atanmadı";
function render(){const titles={overview:["Genel Bakış","Güncel durum, öncelikler ve iş dağılımı"],tasks:["Görev Takibi","İşlerin durumu, sorumlusu ve teslim tarihleri"],calendar:["Takvim","Görev son tarihleri ve planlanan etkinlikler"],goals:["Hedefler","Hedefler ve gerçekleşme sonuçları"],streams:["İş Grupları","Sorumluluk alanlarının toplu görünümü"],members:["Ortaklar ve Ekip","Yetkili kullanıcılar ve görev dağılımı"]};$("#pageTitle").textContent=titles[state.view][0];$("#pageSubtitle").textContent=titles[state.view][1];document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));const c=$("#content");c.innerHTML=({overview:overview,tasks:tasksView,calendar:calendarView,goals:goalsView,streams:streamsView,members:membersView})[state.view]();bindView()}
function stat(label,num,detail){return '<div class="card"><div class="small muted">'+label+'</div><div class="num">'+num+'</div><div class="small muted">'+detail+'</div></div>'}
function overview(){const ts=state.tasks,done=ts.filter(t=>t.status==="tamamlandi").length,active=ts.filter(t=>t.status==="devam_ediyor").length,late=ts.filter(t=>t.due_date&&t.due_date<iso(new Date())&&!["tamamlandi","iptal"].includes(t.status)).length,priority=ts.filter(t=>t.priority==="kritik"&&t.status!=="tamamlandi").length;
const soon=[...ts].filter(t=>t.status!=="tamamlandi"&&t.status!=="iptal").sort((a,b)=>(a.due_date||"9999").localeCompare(b.due_date||"9999")).slice(0,6);
return '<div class="kpi">'+stat("Toplam görev",ts.length,"Kayıtlı işler")+stat("Devam eden",active,"Aktif çalışmalar")+stat("Tamamlanan",done,"Sonuçlanan işler")+stat("Geciken",late,"Süresi geçen")+stat("Kritik",priority,"Öncelikli takip")+'</div><div class="twocol"><section class="panel"><div class="titlebar"><h2>Yakın Takip</h2><button class="btn sm" data-view="tasks">Tüm görevler</button></div>'+(soon.length?soon.map(t=>'<div class="stream"><div class="row"><div style="min-width:0"><div style="font-weight:700;font-size:14px">'+esc(t.title)+'</div><div class="small muted" style="margin-top:5px">'+esc(streamName(t.workstream_id))+' · '+(t.due_date?date(t.due_date):"Tarih atanmamış")+'</div></div><span class="tag '+esc(t.priority)+'">'+esc(labels[t.priority])+'</span></div></div>').join(""):'<div class="empty">Takip edilecek görev yok.</div>')+'</section><section class="panel"><h2>İş Grupları İlerlemesi</h2>'+state.streams.map(s=>{const list=ts.filter(t=>t.workstream_id===s.id),pct=list.length?Math.round(list.filter(t=>t.status==="tamamlandi").length/list.length*100):0;return '<div class="stream"><div class="row small"><strong>'+esc(s.name)+'</strong><span>'+list.length+' iş · %'+pct+'</span></div><div class="bar" style="margin-top:11px"><i style="width:'+pct+'%;background:'+esc(s.color)+'"></i></div></div>'}).join("")+'</section></div><section class="panel"><div class="row"><div><h2>Hedef Gerçekleşmesi</h2><div class="muted small">'+state.goals.length+' hedef tanımlı</div></div><button data-view="goals" class="btn sm">Hedefleri Gör</button></div></section>'}
function tasksView(){const can=state.role!=="viewer";return '<div class="titlebar"><h2>Görev Listesi <span class="muted small">('+state.tasks.length+')</span></h2>'+(can?'<button class="btn primary" id="newTask">+ Yeni Görev</button>':'')+'</div><div class="filters"><input id="taskSearch" placeholder="Görev ara..." value="'+esc(state.search)+'"><select id="statusFilter">'+options([["all","Tüm durumlar"],["taslak","Taslak"],["beklemede","Beklemede"],["devam_ediyor","Devam Ediyor"],["tamamlandi","Tamamlandı"],["iptal","İptal"]],state.status)+'</select><select id="streamFilter">'+options([["all","Tüm iş grupları"],...state.streams.map(x=>[x.id,x.name])],state.stream)+'</select></div><section class="panel tablewrap" style="padding:7px"><table><thead><tr><th>Görev</th><th>İş Grubu</th><th>Sorumlu</th><th>Öncelik</th><th>Durum</th><th>Bitiş</th><th>İlerleme</th><th></th></tr></thead><tbody id="taskBody"></tbody></table></section>'}
function renderTaskRows(){const el=$("#taskBody");if(!el)return;const filtered=state.tasks.filter(t=>(state.status==="all"||state.status===t.status)&&(state.stream==="all"||state.stream===t.workstream_id)&&(!state.search||[t.title,t.description].some(x=>String(x||"").toLocaleLowerCase("tr-TR").includes(state.search.toLocaleLowerCase("tr-TR")))));el.innerHTML=filtered.map(t=>'<tr><td><div class="taskname">'+esc(t.title)+'</div></td><td>'+esc(streamName(t.workstream_id))+'</td><td>'+esc(memberName(t.assigned_to))+'</td><td><span class="tag '+esc(t.priority)+'">'+esc(labels[t.priority])+'</span></td><td><span class="tag '+esc(t.status)+'">'+esc(labels[t.status])+'</span></td><td>'+date(t.due_date)+'</td><td>%'+esc(t.progress)+'</td><td><button class="btn sm" data-edit-task="'+esc(t.id)+'">Aç</button></td></tr>').join("")||'<tr><td colspan="8" class="empty">Bu filtreye uygun görev yok.</td></tr>'}
function goalsView(){return '<div class="titlebar"><h2>Performans Hedefleri</h2>'+(canManage()?'<button class="btn primary" id="newGoal">+ Hedef Ekle</button>':'')+'</div><div class="gridcards">'+(state.goals.map(g=>{const p=g.target_value>0?Math.round(100*g.actual_value/g.target_value):0;return '<div class="goal"><div class="row"><div class="small muted">'+esc(streamName(g.workstream_id))+'</div>'+(canManage()?'<button class="btn sm" data-edit-goal="'+esc(g.id)+'">Düzenle</button>':'')+'</div><h3>'+esc(g.title)+'</h3><div class="val">'+esc(g.actual_value)+' <span class="muted small">/ '+esc(g.target_value)+' '+esc(g.unit)+'</span></div><div class="bar" style="margin:13px 0 8px"><i style="width:'+Math.min(100,p)+'%"></i></div><div class="small muted">%'+p+' tamamlandı · '+date(g.period_end)+'</div></div>'}).join("")||'<div class="panel empty">Henüz hedef tanımlanmadı. Kayıt sayısı, bütçe ve benzeri hedefler buradan izlenebilir.</div>')+'</div>'}
function streamsView(){return '<div class="titlebar"><h2>Sorumluluk Alanları</h2></div><div class="gridcards">'+state.streams.map(s=>{const list=state.tasks.filter(t=>t.workstream_id===s.id);return '<div class="goal" style="border-left:5px solid '+esc(s.color)+'"><h3>'+esc(s.name)+'</h3><p class="muted small">'+esc(s.description||"")+'</p><div class="row"><strong>'+list.length+' görev</strong><span class="small muted">'+list.filter(t=>t.status==="tamamlandi").length+' tamamlandı</span></div></div>'}).join("")+'</div>'}
function membersView(){return '<div class="titlebar"><h2>Ortaklar ve Ekip</h2>'+(canManage()?'<button class="btn primary" id="newMember">+ Kullanıcı Davet Et</button>':'')+'</div><section class="panel">'+state.members.map(m=>'<div class="member"><div class="miniavatar">'+esc(memberName(m.user_id).slice(0,2).toLocaleUpperCase("tr-TR"))+'</div><div style="flex:1"><strong>'+esc(memberName(m.user_id))+'</strong><div class="small muted">'+(m.is_active?"Aktif":"Pasif")+'</div></div><span class="tag">'+esc(labels[m.role]||m.role)+'</span></div>').join("")+'</section><p class="muted small">Yetki seviyeleri: Kurucu, Yönetici, Üye ve İzleyici. Kullanıcılar kendi hesaplarıyla giriş yapar.</p>'}
function calendarView(){const m=state.month,y=m.getFullYear(),mo=m.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,last=new Date(y,mo+1,0).getDate(),head=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x=>'<div class="caldow">'+x+'</div>').join("");let grid="";for(let i=0;i<42;i++){const d=new Date(y,mo,i-first+1),key=iso(d),off=d.getMonth()!==mo;const tasks=state.tasks.filter(t=>t.due_date===key&&t.status!=="iptal").map(t=>'<div class="calitem" title="'+esc(t.title)+'">'+esc(t.title)+'</div>');const events=state.events.filter(e=>iso(new Date(e.starts_at))===key).map(e=>'<div class="calitem ev" title="'+esc(e.title)+'">'+esc(e.title)+'</div>');grid+='<div class="day '+(off?"off ":"")+(key===iso(new Date())?"today":"")+'"><div class="daynum">'+d.getDate()+'</div>'+tasks.concat(events).slice(0,3).join("")+(tasks.length+events.length>3?'<div class="tiny">+'+(tasks.length+events.length-3)+' diğer</div>':'')+'</div>'}return '<div class="calendarhead"><div class="actions"><button id="prevMonth" class="btn sm">‹</button><h2 style="margin:0;font-size:19px">'+m.toLocaleDateString("tr-TR",{month:"long",year:"numeric"})+'</h2><button id="nextMonth" class="btn sm">›</button></div>'+(state.role!=="viewer"?'<button class="btn primary" id="newEvent">+ Etkinlik Ekle</button>':'')+'</div><section class="panel" style="padding:12px"><div class="calgrid">'+head+grid+'</div></section><div class="small muted">Turkuaz: görev bitişi · Mor: takvim etkinliği</div>'}
function bindView(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});$("#newTask")?.addEventListener("click",()=>openModal("task"));$("#newGoal")?.addEventListener("click",()=>openModal("goal"));$("#newEvent")?.addEventListener("click",()=>openModal("event"));$("#newMember")?.addEventListener("click",()=>openModal("member"));document.querySelectorAll("[data-edit-task]").forEach(b=>b.onclick=()=>openModal("task",state.tasks.find(t=>t.id===b.dataset.editTask)));document.querySelectorAll("[data-edit-goal]").forEach(b=>b.onclick=()=>openModal("goal",state.goals.find(g=>g.id===b.dataset.editGoal)));$("#taskSearch")?.addEventListener("input",e=>{state.search=e.target.value;renderTaskRows()});$("#statusFilter")?.addEventListener("change",e=>{state.status=e.target.value;renderTaskRows()});$("#streamFilter")?.addEventListener("change",e=>{state.stream=e.target.value;renderTaskRows()});renderTaskRows();$("#prevMonth")?.addEventListener("click",()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);render()});$("#nextMonth")?.addEventListener("click",()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);render()})}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});
let editing=null,modalKind="";
const field=(name,label,val="",type="text",extra="")=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(val??"")+'" '+extra+'></label>';
const sel=(name,label,opts,val)=>'<label>'+label+'<select name="'+name+'">'+options(opts,val)+'</select></label>';
function openModal(kind,item){modalKind=kind;editing=item||null;const f=$("#modalFields");const people=[["","Atanmadı"],...state.members.filter(m=>m.is_active).map(m=>[m.user_id,memberName(m.user_id)])],streams=[["","Genel"],...state.streams.map(s=>[s.id,s.name])];$("#modalTitle").textContent=({task:item?"Görevi Düzenle":"Yeni Görev",goal:item?"Hedefi Düzenle":"Yeni Hedef",event:"Takvime Etkinlik Ekle",member:"Yeni Kullanıcı Daveti"})[kind];
if(kind==="task")f.innerHTML='<div class="span2">'+field("title","Görev başlığı *",item?.title||"","text","required minlength=3 maxlength=240")+'</div><label class="span2">Açıklama<textarea name="description" rows="3">'+esc(item?.description||"")+'</textarea></label>'+sel("workstream_id","İş Grubu",streams,item?.workstream_id)+sel("assigned_to","Sorumlu",people,item?.assigned_to)+sel("status","Durum",[["taslak","Taslak"],["beklemede","Beklemede"],["devam_ediyor","Devam Ediyor"],["tamamlandi","Tamamlandı"],["iptal","İptal"]],item?.status||"taslak")+sel("priority","Öncelik",[["dusuk","Düşük"],["normal","Normal"],["yuksek","Yüksek"],["kritik","Kritik"]],item?.priority||"normal")+field("start_date","Başlangıç tarihi",item?.start_date||"","date")+field("due_date","Bitiş tarihi",item?.due_date||"","date")+field("progress","İlerleme (%)",item?.progress??0,"number",'min=0 max=100');
if(kind==="goal")f.innerHTML='<div class="span2">'+field("title","Hedef adı *",item?.title||"","text","required")+'</div>'+sel("workstream_id","İş Grubu",streams,item?.workstream_id)+sel("owner_id","Sorumlu",people,item?.owner_id)+field("target_value","Hedef değer",item?.target_value??0,"number",'min=0 step=any')+field("actual_value","Gerçekleşen",item?.actual_value??0,"number",'min=0 step=any')+field("unit","Birim",item?.unit||"adet")+field("period_start","Dönem başlangıcı",item?.period_start||"","date")+field("period_end","Dönem bitişi",item?.period_end||"","date");
if(kind==="event")f.innerHTML='<div class="span2">'+field("title","Etkinlik adı *","","text","required")+'</div><label class="span2">Açıklama<textarea name="details" rows="3"></textarea></label>'+field("starts_at","Başlangıç *","","datetime-local","required")+field("ends_at","Bitiş *","","datetime-local","required")+sel("assigned_to","Sorumlu",people,"");
if(kind==="member")f.innerHTML='<div class="span2">'+field("email","E-posta adresi *","","email","required")+'</div><div class="span2">'+field("full_name","Ad soyad *","","text","required")+'</div>'+sel("role","Yetki",[["member","Üye"],["viewer","İzleyici"],...(state.role==="owner"?[["manager","Yönetici"]]:[])],"member")+'<p class="span2 muted small">Davetiye e-posta adresine gönderilir. Kişi kendi şifresini belirler.</p>';
$("#modalscrim").classList.remove("hide")}
function closeModal(){$("#modalscrim").classList.add("hide");editing=null}
$("#closeModal").onclick=closeModal;$("#cancelModal").onclick=closeModal;$("#modalscrim").addEventListener("click",e=>{if(e.target.id==="modalscrim")closeModal()});
$("#modalForm").onsubmit=async ev=>{ev.preventDefault();const b=$("#modalForm button[type=submit]");b.disabled=true;const data=Object.fromEntries(new FormData(ev.target));try{
if(modalKind==="member"){const {data:{session}}=await sb.auth.getSession();const r=await fetch("https://gnwliizxuryfnpqrynym.supabase.co/functions/v1/ortak-takip-panel?api=invite",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify({workspace_id:WS,email:data.email.trim(),full_name:data.full_name.trim(),role:data.role})});const d=await r.json();if(!r.ok)throw Error(d.error||"Davet gönderilemedi");toast("Davet gönderildi")}
else{const table=modalKind==="task"?"tasks":modalKind==="goal"?"goals":"calendar_events";const payload={...data,workspace_id:WS};for(const k of ["workstream_id","assigned_to","owner_id","start_date","due_date","period_start","period_end"])if(k in payload&&!payload[k])payload[k]=null;
if(modalKind==="task"){payload.progress=Number(payload.progress);if(payload.status==="tamamlandi"){payload.progress=100;payload.completed_at=new Date().toISOString()}else if(editing?.status==="tamamlandi")payload.completed_at=null}
if(modalKind==="goal"){payload.target_value=Number(payload.target_value);payload.actual_value=Number(payload.actual_value)}
if(modalKind==="event"){if(new Date(payload.ends_at)<=new Date(payload.starts_at))throw Error("Bitiş başlangıçtan sonra olmalı");payload.starts_at=new Date(payload.starts_at).toISOString();payload.ends_at=new Date(payload.ends_at).toISOString()}
let r;if(editing){r=await sb.from(table).update(payload).eq("id",editing.id).eq("workspace_id",WS)}else{payload.created_by=state.user.id;r=await sb.from(table).insert(payload)}
if(r.error)throw r.error;toast("Kayıt başarıyla kaydedildi")}
closeModal();await refresh()
}catch(e){error(e)}finally{b.disabled=false}};
sb.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT")showAuth();if(event==="SIGNED_IN"||event==="TOKEN_REFRESHED")setTimeout(()=>{if($("#shell").classList.contains("hide"))boot()},0)});
boot().catch(error);
</script></body></html>
