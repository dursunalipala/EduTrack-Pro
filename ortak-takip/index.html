<section id="auth"><div class="authbox"><div class="logo">✓</div><h1>Ortak Takip</h1><p>Kurumsal yönetim ve görev takip sistemi</p><form id="authform"><div id="namefield" class="hide"><input id="authname" placeholder="Adınız soyadınız" autocomplete="name"></div><input id="email" type="email" placeholder="E-posta adresiniz" required autocomplete="username"><input id="password" type="password" placeholder="Şifre (en az 8 karakter)" required minlength="8" autocomplete="current-password"><button id="submitAuth" class="btn primary" type="submit">Giriş Yap</button></form><form id="recoveryForm" class="hide"><input id="newRecoveryPassword" type="password" autocomplete="new-password" placeholder="Yeni şifre (en az 8 karakter)" required minlength="8"><input id="confirmRecoveryPassword" type="password" autocomplete="new-password" placeholder="Yeni şifre (tekrar)" required minlength="8"><button class="btn primary" type="submit">Yeni Şifreyi Kaydet</button></form><div class="authlinks"><button class="linkbtn" id="switchAuth">Hesap oluştur</button><button class="linkbtn" id="resetAuth">Şifremi unuttum</button></div><p id="authmsg" class="small" style="margin:18px 0 0"></p><p class="tiny" style="margin-top:16px">Yalnızca yetkili kullanıcıların kurum verilerine erişmesine izin verilir.</p></div></section>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.95.0";
const URL="https://gnwliizxuryfnpqrynym.supabase.co",KEY="sb_publishable_nNQjagytmTUtlvUL6MYOmw_UQJANk3C";
const sb=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const WS="bd7ea9a8-f1b7-4c32-9c8c-44725374ac6b";
const $=s=>document.querySelector(s),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state={user:null,role:"",view:"overview",tasks:[],streams:[],goals:[],events:[],members:[],profiles:[],invites:[],reportPeriod:"all",reportStream:"all",month:new Date(),calendarDay:null,search:"",status:"all",stream:"all"};
const labels={taslak:"Taslak",beklemede:"Beklemede",devam_ediyor:"Devam Ediyor",tamamlandi:"Tamamlandı",iptal:"İptal",dusuk:"Düşük",normal:"Normal",yuksek:"Yüksek",kritik:"Kritik",owner:"Kurucu",manager:"Yönetici",member:"Üye",viewer:"İzleyici"};

function toast(m){const a=$("#toast");a.textContent=m;a.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>a.style.display="none",4500)}
function error(e){toast(e?.message||String(e)||"İşlem başarısız");console.error(e)}
let authMode="login";
let recoveryMode=new URLSearchParams(window.location.hash.replace(/^#/,"")).get("type")==="recovery";
function showRecoveryScreen(){
  recoveryMode=true;
  $("#auth").classList.remove("hide");$("#shell").classList.add("hide");
  $("#authform").classList.add("hide");$("#recoveryForm").classList.remove("hide");
  $(".authlinks").classList.add("hide");$(".authbox h1").textContent="Yeni Şifre Belirle";
  $("#authmsg").textContent="Hesap şifrenizi güvenli bir şekilde yenileyin.";
}
function exitRecoveryScreen(){
  recoveryMode=false;
  $("#authform").classList.remove("hide");$("#recoveryForm").classList.add("hide");
  $(".authlinks").classList.remove("hide");$(".authbox h1").textContent="Ortak Takip";
}
$("#recoveryForm").onsubmit=async ev=>{
  ev.preventDefault();
  const pass=$("#newRecoveryPassword").value,repeat=$("#confirmRecoveryPassword").value;
  const btn=$("#recoveryForm button[type=submit]");
  if(pass.length<8){$("#authmsg").textContent="Yeni şifre en az 8 karakter olmalıdır.";return}
  if(pass!==repeat){$("#authmsg").textContent="Şifreler uyuşmuyor.";return}
  btn.disabled=true;
  try {
    const verified=await sb.auth.getUser();
    if(verified.error||!verified.data?.user)throw Error("Şifre yenileme bağlantısı geçersiz veya süresi dolmuş. Yeni bağlantı isteyin.");
    const result=await sb.auth.updateUser({password:pass});
    if(result.error)throw result.error;
    exitRecoveryScreen();
    window.history.replaceState(null,"",window.location.pathname);
    await sb.auth.signOut();
    $("#password").value="";
    $("#authmsg").textContent="Şifreniz güncellendi. Yeni şifrenizle giriş yapabilirsiniz.";
  }catch(e){$("#authmsg").textContent=e?.message||"Şifre güncellenemedi."}
  finally{btn.disabled=false}
};
$("#switchAuth").onclick=()=>{authMode=authMode==="login"?"signup":"login";$("#namefield").classList.toggle("hide",authMode!=="signup");$("#submitAuth").textContent=authMode==="signup"?"Hesap Oluştur":"Giriş Yap";$("#switchAuth").textContent=authMode==="signup"?"Girişe dön":"Hesap oluştur";$("#authmsg").textContent=""};
$("#resetAuth").onclick=async()=>{const email=$("#email").value.trim();if(!email){$("#authmsg").textContent="Önce e-posta adresinizi giriniz.";return}const {error:e}=await sb.auth.resetPasswordForEmail(email,{redirectTo:"https://ortak-takip.onrender.com/"});$("#authmsg").textContent=e?e.message:"Bu adrese kayıtlı bir hesap varsa şifre yenileme bağlantısı gönderilecektir."};
$("#authform").onsubmit=async ev=>{ev.preventDefault();const b=$("#submitAuth");b.disabled=true;$("#authmsg").textContent="";const email=$("#email").value.trim(),password=$("#password").value;try{let r;if(authMode==="signup"){r=await sb.auth.signUp({email,password,options:{data:{full_name:$("#authname").value.trim()},emailRedirectTo:window.location.origin+window.location.pathname}});if(r.error)throw r.error;$("#authmsg").textContent="Hesabınız oluşturuldu. E-posta doğrulama bağlantısını açıp ardından giriş yapınız."}else{r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;await boot()}}catch(e){$("#authmsg").textContent=e.message}finally{b.disabled=false}};
$("#logout").onclick=async()=>{await sb.auth.signOut();showAuth()};
function showAuth(){$("#auth").classList.remove("hide");$("#shell").classList.add("hide")}
async function fetchAll(){const q=[sb.from("workstreams").select("*").eq("workspace_id",WS).order("sort_order"),sb.from("tasks").select("*").eq("workspace_id",WS).order("created_at",{ascending:false}),sb.from("goals").select("*").eq("workspace_id",WS),sb.from("calendar_events").select("*").eq("workspace_id",WS),sb.from("workspace_members").select("*").eq("workspace_id",WS),sb.from("workspace_invites").select("email,role,status,created_at").eq("workspace_id",WS).eq("status","pending")];
const r=await Promise.all(q);for(const a of r)if(a.error)throw a.error;
[state.streams,state.tasks,state.goals,state.events,state.members,state.invites]=r.map(a=>a.data||[]);
let ids=state.members.map(x=>x.user_id);
state.profiles=[];if(ids.length){const p=await sb.from("profiles").select("id,full_name").in("id",ids);if(!p.error)state.profiles=p.data||[]}
}
async function boot(){if(recoveryMode){showRecoveryScreen();return}const {data:{user}}=await sb.auth.getUser();if(!user){showAuth();return}state.user=user;
const {data:me,error:e}=await sb.from("workspace_members").select("role,is_active").eq("workspace_id",WS).eq("user_id",user.id).maybeSingle();if(e){error(e);return}
if(!me?.is_active){showAuth();$("#authmsg").textContent="Giriş yapıldı ancak Ortak Takip çalışma alanı yetkiniz henüz tanımlanmamış. Yöneticiye başvurunuz.";return}
state.role=me.role;$("#sideemail").textContent=user.email||"";$("#userrole").textContent=labels[state.role]||state.role;$("#avatar").textContent=(user.user_metadata?.full_name||user.email||"OT").slice(0,2).toLocaleUpperCase("tr-TR");await refresh();$("#auth").classList.add("hide");$("#shell").classList.remove("hide")}
async function refresh(){try{await fetchAll();render()}catch(e){error(e)}}
const streamName=id=>state.streams.find(s=>s.id===id)?.name||"Genel",memberName=id=>state.profiles.find(p=>p.id===id)?.full_name||state.members.find(m=>m.user_id===id)?.user_id.slice(0,8)||"Atanmadı";
function render(){const titles={overview:["Genel Bakış","Güncel durum, öncelikler ve iş dağılımı"],tasks:["Görev Takibi","İşlerin durumu, sorumlusu ve teslim tarihleri"],calendar:["Takvim","Görev son tarihleri ve planlanan etkinlikler"],goals:["Hedefler","Hedefler ve gerçekleşme sonuçları"],streams:["İş Grupları","Bölüm sorumluları ve ortak alanlar"],reports:["Raporlama","Bölüm ve sorumlu bazında performans"],members:["Ortaklar ve Ekip","Yetkili kullanıcılar ve görev dağılımı"]};$("#pageTitle").textContent=titles[state.view][0];$("#pageSubtitle").textContent=titles[state.view][1];document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));const c=$("#content");c.innerHTML=({overview:overview,tasks:tasksView,calendar:calendarView,goals:goalsView,streams:streamsView,reports:reportsView,members:membersView})[state.view]();bindView()}

});

function makeReportSnapshot(){
  const items=reportTasks().slice(),day=iso(new Date()),period=state.reportPeriod==="month"?"Bu ay açılan işler":state.reportPeriod==="30"?"Son 30 günde açılan işler":"Tüm tarihler";
  const scope=state.reportStream==="all"?"Tüm iş grupları":streamName(state.reportStream);
  const open=items.filter(t=>!["tamamlandi","iptal"].includes(t.status));
  const done=items.filter(t=>t.status==="tamamlandi").length;
  const groups=state.streams.filter(w=>state.reportStream==="all"||w.id===state.reportStream).map(w=>{
    const groupItems=items.filter(t=>t.workstream_id===w.id);
    const completed=groupItems.filter(t=>t.status==="tamamlandi").length;
    const late=groupItems.filter(t=>t.due_date&&t.due_date<day&&!["tamamlandi","iptal"].includes(t.status)).length;
    return {name:w.name,lead:memberName(w.lead_user_id),total:groupItems.length,done:completed,late,pct:groupItems.length?Math.round(100*completed/groupItems.length):0};
  });
  const tasks=items.map((t,i)=>({num:i+1,group:streamName(t.workstream_id),title:t.title,description:t.description||"",person:memberName(t.assigned_to),
    collaborators:(t.collaborator_user_ids||[]).map(memberName).join(", "),status:labels[t.status]||t.status,priority:labels[t.priority]||t.priority,
    due:t.due_date||"",progress:Number(t.progress)||0,transfer:t.last_delegated_at||"",transferredBy:t.last_delegated_by?memberName(t.last_delegated_by):""}));
  return {day,period,scope,tasks,groups,totals:{total:items.length,done,open:open.length,late:open.filter(t=>t.due_date&&t.due_date<day).length,
    shared:items.filter(t=>(t.collaborator_user_ids||[]).length>0).length,delegated:items.filter(t=>t.last_delegated_at).length,
    percent:items.length?Math.round(100*done/items.length):0}};
}
function reportFileName(ext){return "ortak-takip-rapor-"+iso(new Date())+"."+ext}
const reportLibraries={};
function loadReportLibrary(url,ready){
  if(ready())return Promise.resolve();
  if(!reportLibraries[url]){
    reportLibraries[url]=new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      script.src=url;script.async=true;script.crossOrigin="anonymous";
      script.onload=()=>ready()?resolve():reject(Error("Dışa aktarma kitaplığı başlatılamadı"));
      script.onerror=()=>reject(Error("Dışa aktarma kitaplığı indirilemedi. İnternet bağlantısını kontrol edin"));
      document.head.appendChild(script);
    }).catch(err=>{delete reportLibraries[url];throw err});
  }
  return reportLibraries[url];
}
async function performReportDownload(buttonId,action){
  const button=$(buttonId);if(!button||button.disabled)return;
  button.disabled=true;const original=button.textContent;button.textContent="Hazırlanıyor...";
  try{await action()}catch(e){console.error("Rapor indirme hatası:",e);toast(e?.message||"Rapor hazırlanamadı")}
  finally{button.disabled=false;button.textContent=original}
}

function exportReportCsv(){
const rows=[["İş Grubu","Görev","Birincil Sorumlu","Ortak Sorumlular","Durum","Öncelik","Son Tarih","İlerleme (%)","Son Devir Tarihi"]];
for(const t of reportTasks())rows.push([streamName(t.workstream_id),t.title,memberName(t.assigned_to),(t.collaborator_user_ids||[]).map(memberName).join(", "),labels[t.status]||t.status,labels[t.priority]||t.priority,t.due_date||"",t.progress??0,t.last_delegated_at||""]);
const clean=v=>{let x=String(v??"");if(/^[=+@-]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};
const csv="\uFEFF"+rows.map(r=>r.map(clean).join(";")).join("\r\n");
const url=window.URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
const link=document.createElement("a");link.href=url;link.download="ortak-takip-rapor-"+iso(new Date())+".csv";document.body.appendChild(link);link.click();link.remove();setTimeout(()=>window.URL.revokeObjectURL(url),2000);
}

function taskOccursOnDay(t,day){
  if(t.status==="iptal")return false;
  const start=t.start_date||t.due_date,end=t.due_date||t.start_date;
  if(!start)return false;
  if(end<start)return day===start||day===end;
  return start<=day&&day<=end;
}
function calendarView(){
  const m=state.month,y=m.getFullYear(),mo=m.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,head=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x=>'<div class="caldow">'+x+'</div>').join("");
  let grid="";
  for(let i=0;i<42;i++){
    const d=new Date(y,mo,i-first+1),key=iso(d),off=d.getMonth()!==mo;
    const tasks=state.tasks.filter(t=>taskOccursOnDay(t,key)),events=state.events.filter(e=>iso(new Date(e.starts_at))===key);
    const highlights=tasks.map(t=>'<div class="calitem" title="'+esc(t.title)+'">'+esc(t.title)+'</div>');
    const eventHighlights=events.map(e=>'<div class="calitem ev" title="'+esc(e.title)+'">'+esc(e.title)+'</div>');
    const selected=state.calendarDay===key;
    grid+='<div class="day calendar-day '+(off?"off ":"")+(key===iso(new Date())?"today ":"")+(selected?"selected-day":"")+'" role="button" tabindex="0" aria-label="'+esc(date(key))+' '+tasks.length+' görev" aria-pressed="'+selected+'" data-calendar-day="'+esc(key)+'"><div class="daynum">'+d.getDate()+' '+(tasks.length?'<span class="calendar-count">'+tasks.length+'</span>':"")+'</div>'+
      highlights.concat(eventHighlights).slice(0,3).join("")+ (highlights.length+eventHighlights.length>3?'<div class="tiny">+'+(highlights.length+eventHighlights.length-3)+' diğer</div>':"")+'</div>';
  }
  const day=state.calendarDay,selectedTasks=day?state.tasks.filter(t=>taskOccursOnDay(t,day)):[],selectedEvents=day?state.events.filter(e=>iso(new Date(e.starts_at))===day):[];
  const taskRows=selectedTasks.map(t=>'<div class="calendar-task"><div style="flex:1;min-width:0"><strong>'+esc(t.title)+'</strong><div class="small muted">'+esc(streamName(t.workstream_id))+' · '+esc(memberName(t.assigned_to))+' · '+esc(labels[t.status]||t.status)+'</div>'+
    (t.description?'<div class="small" style="margin-top:6px;white-space:pre-wrap">'+esc(t.description)+'</div>':"")+
    '<div class="small muted" style="margin-top:5px">Başlangıç: '+esc(date(t.start_date))+' · Bitiş: '+esc(date(t.due_date))+' · İlerleme: %'+esc(t.progress)+'</div></div>'+
    (state.role!=="viewer"?'<button type="button" class="btn sm" data-calendar-task="'+esc(t.id)+'">Aç / Düzenle</button>':"")+'</div>').join("");
  const eventRows=selectedEvents.map(e=>'<div class="calendar-task"><div><strong>Etkinlik: '+esc(e.title)+'</strong><div class="small muted">'+esc(new Date(e.starts_at).toLocaleString("tr-TR"))+' – '+esc(new Date(e.ends_at).toLocaleString("tr-TR"))+'</div>'+(e.details?'<p class="small">'+esc(e.details)+'</p>':"")+'</div></div>').join("");
  const dayPanel=day?'<section class="panel calendar-detail" id="calendarDayDetail"><div class="row"><div><h2>'+esc(date(day))+' · Günlük Görevler</h2><div class="small muted">'+selectedTasks.length+' görev · '+selectedEvents.length+' etkinlik</div></div>'+(state.role!=="viewer"?'<button class="btn sm primary" id="newTaskOnDay">+ Bu Güne Görev</button>':"")+'</div>'+
     (taskRows||'<p class="small muted">Bu tarihte görev bulunmuyor. Yeni görev oluşturabilirsiniz.</p>')+eventRows+'</section>':"";
  const unscheduled=state.tasks.filter(t=>!t.start_date&&!t.due_date&&t.status!=="iptal");
  const unscheduledPanel=unscheduled.length?'<section class="panel"><h2>Tarihi Belirlenmemiş Görevler ('+unscheduled.length+')</h2><p class="small muted">Takvimde görünmeleri için başlangıç veya bitiş tarihi atayın.</p>'+unscheduled.slice(0,12).map(t=>'<div class="calendar-task"><div style="flex:1"><strong>'+esc(t.title)+'</strong><div class="small muted">'+esc(memberName(t.assigned_to))+'</div></div>'+(state.role!=="viewer"?'<button class="btn sm" data-calendar-task="'+esc(t.id)+'">Tarih Ekle</button>':"")+'</div>').join("")+'</section>':"";
  return '<div class="calendarhead"><div class="actions"><button id="prevMonth" class="btn sm">‹</button><h2 style="margin:0;font-size:19px">'+m.toLocaleDateString("tr-TR",{month:"long",year:"numeric"})+'</h2><button id="nextMonth" class="btn sm">›</button><button id="calendarToday" class="btn sm">Bugün</button></div>'+(state.role!=="viewer"?'<button class="btn primary" id="newEvent">+ Etkinlik Ekle</button>':"")+'</div>'+
  '<section class="panel" style="padding:12px"><div class="calgrid">'+head+grid+'</div></section><div class="small muted">Güne dokunun: görevler ve etkinlikler açılır. Turkuaz: görev · Mor: etkinlik.</div>'+dayPanel+unscheduledPanel;
}

if(kind==="task")f.innerHTML='<div class="span2">'+field("title","Görev başlığı *",item?.title||"","text","required minlength=3 maxlength=240")+'</div><label class="span2">Açıklama<textarea name="description" rows="3">'+esc(item?.description||"")+'</textarea></label>'+sel("workstream_id","İş Grubu",streams,item?.workstream_id)+sel("assigned_to","Sorumlu",people,item?.assigned_to)+sel("status","Durum",[["taslak","Taslak"],["beklemede","Beklemede"],["devam_ediyor","Devam Ediyor"],["tamamlandi","Tamamlandı"],["iptal","İptal"]],item?.status||"taslak")+sel("priority","Öncelik",[["dusuk","Düşük"],["normal","Normal"],["yuksek","Yüksek"],["kritik","Kritik"]],item?.priority||"normal")+field("start_date","Başlangıç tarihi",item?.start_date||"","date")+field("due_date","Bitiş tarihi",item?.due_date||"","date")+field("progress","İlerleme (%)",item?.progress??0,"number",'min=0 max=100')+multiPeopleField("shared_users",item?.collaborator_user_ids||[])+(item?.last_delegated_at?'<div class="span2 small muted">Son devir: '+esc(memberName(item.last_delegated_by))+' · '+date(item.last_delegated_at)+'</div>':"");

async function requireActiveSession(){
  const verified=await sb.auth.getUser();
  if(verified.error || !verified.data?.user || verified.data.user.id!==state.user?.id){
    closeModal();showAuth();
    $("#authmsg").textContent="Oturumunuz geçersiz veya süresi dolmuş. Lütfen yeniden giriş yapıp işlemi tekrar deneyin.";
    throw Error("Oturum doğrulanamadı; yeniden giriş yapmanız gerekiyor.");
  }
  const result=await sb.auth.getSession();
  if(result.error || !result.data?.session?.access_token){
    closeModal();showAuth();
    $("#authmsg").textContent="Oturumunuz süresi dolduğu için kapandı. Lütfen yeniden giriş yapın.";
    throw Error("Oturum süresi doldu. Lütfen yeniden giriş yapın.");
  }
  return result.data.session;
}
$("#modalForm").onsubmit=async ev=>{ev.preventDefault();const b=$("#modalForm button[type=submit]");b.disabled=true;const fd=new FormData(ev.target);const data=Object.fromEntries(fd);const shared=[...new Set(fd.getAll("shared_users"))].filter(id=>state.members.some(m=>m.user_id===id&&m.is_active));delete data.shared_users;try{
const session=await requireActiveSession();
if(modalKind==="member"){const r=await fetch("https://gnwliizxuryfnpqrynym.supabase.co/functions/v1/ortak-takip-panel?api=invite",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify({workspace_id:WS,email:data.email.trim(),full_name:data.full_name.trim(),role:data.role})});const d=await r.json();if(!r.ok)throw Error(d.error||"Davet gönderilemedi");toast("Davet gönderildi")}
else if(modalKind==="stream"){if(!canManage()||!editing)throw Error("Bu işlem için yönetici yetkisi gereklidir.");const payload={name:data.name.trim(),description:data.description||"",lead_user_id:data.lead_user_id||null,collaborator_user_ids:shared.filter(x=>x!==data.lead_user_id)};const r=await sb.from("workstreams").update(payload).eq("id",editing.id).eq("workspace_id",WS);if(r.error)throw r.error;toast("Bölüm bilgileri güncellendi")}
else{const table=modalKind==="task"?"tasks":modalKind==="goal"?"goals":"calendar_events";const payload={...data,workspace_id:WS};for(const k of ["workstream_id","assigned_to","owner_id","start_date","due_date","period_start","period_end"])if(k in payload&&!payload[k])payload[k]=null;
if(modalKind==="task"){payload.collaborator_user_ids=canManage()?shared:(editing?.collaborator_user_ids||[]);if(editing&&editing.assigned_to!==payload.assigned_to&&canManage()){payload.last_delegated_at=new Date().toISOString();payload.last_delegated_by=state.user.id}payload.progress=Number(payload.progress);if(payload.status==="tamamlandi"){payload.progress=100;payload.completed_at=new Date().toISOString()}else if(editing?.status==="tamamlandi")payload.completed_at=null}
if(modalKind==="goal"){payload.target_value=Number(payload.target_value);payload.actual_value=Number(payload.actual_value)}
if(modalKind==="event"){if(new Date(payload.ends_at)<=new Date(payload.starts_at))throw Error("Bitiş başlangıçtan sonra olmalı");payload.starts_at=new Date(payload.starts_at).toISOString();payload.ends_at=new Date(payload.ends_at).toISOString()}
let r;if(editing){r=await sb.from(table).update(payload).eq("id",editing.id).eq("workspace_id",WS)}else{payload.created_by=state.user.id;r=await sb.from(table).insert(payload)}
if(r.error)throw r.error;toast("Kayıt başarıyla kaydedildi")}
closeModal();await refresh()
}catch(e){error(e)}finally{b.disabled=false}};
